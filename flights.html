<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Flights • Wanderly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="./index.html">Wanderly</a>
        <nav class="nav">
          <a class="active" href="./flights.html">Flights</a>
          <a href="./hotels.html">Hotels</a>
          <a href="./trips.html">My Trips</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1>Search Flights</h1>
        <form id="flight-form" class="search-form" autocomplete="off">
          <div class="form-row">
            <label>
              From
              <input type="text" id="from" name="from" placeholder="City or Airport" required />
            </label>
            <label>
              To
              <input type="text" id="to" name="to" placeholder="City or Airport" required />
            </label>
          </div>
          <div class="form-row">
            <label>
              Depart
              <input type="date" id="depart" name="depart" required />
            </label>
            <label>
              Return
              <input type="date" id="return" name="return" />
            </label>
            <label>
              Travelers
              <input type="number" id="travelers" name="travelers" min="1" value="1" required />
            </label>
            <label>
              Class
              <select id="cabin" name="cabin">
                <option>Economy</option>
                <option>Premium Economy</option>
                <option>Business</option>
                <option>First</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Search</button>
          </div>
        </form>

        <div id="flight-results" class="results"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Wanderly.</p>
        <nav class="nav small">
          <a href="./index.html">Home</a>
          <a class="active" href="./flights.html">Flights</a>
          <a href="./hotels.html">Hotels</a>
          <a href="./trips.html">My Trips</a>
        </nav>
      </div>
    </footer>

    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/flights.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
  </html>
